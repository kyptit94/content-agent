name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker chua duoc cai tren server. Cai truoc roi chay lai CD."
              exit 1
            fi

            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main

            if [ ! -f .env ]; then
              echo "Khong tim thay .env trong DEPLOY_PATH. Tao file .env tren server truoc khi deploy."
              if [ -f .env.example ]; then
                echo "Goi y: cp .env.example .env va dien cac bien bat buoc."
              fi
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
            elif docker-compose --version >/dev/null 2>&1; then
              docker-compose up -d --build
            else
              echo "Khong co Docker Compose hoat dong. Cai Compose v2 (docker compose plugin) roi chay lai CD."
              exit 1
            fi

            docker image prune -f
