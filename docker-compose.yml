services:
  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: ai_agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    gpus: all

  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ai_agent_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - VOICE_API_URL=http://voice:8010
      - JOB_QUEUE_NAME=content_jobs
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./prompts:/app/prompts
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - ollama
      - voice

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: ai_agent_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - VOICE_API_URL=http://voice:8010
      - JOB_QUEUE_NAME=content_jobs
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./prompts:/app/prompts
    command: ["python", "-m", "app.workers.content_worker"]
    depends_on:
      - redis
      - ollama
      - voice

  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    container_name: ai_agent_voice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COQUI_MODEL_NAME=tts_models/multilingual/multi-dataset/xtts_v2
      - COQUI_TOS_AGREED=1
      - VOICE_SAMPLE_DIR=/app/data/voices
      - VOICE_OUTPUT_DIR=/app/data/outputs
    volumes:
      - ./voice_clone:/app/voice_clone
      - ./data:/app/data
    ports:
      - "8010:8010"
    gpus: all

volumes:
  ollama_data:
